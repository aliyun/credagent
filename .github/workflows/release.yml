name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.3.0)'
        required: true

permissions:
  contents: write

env:
  # Files copied into every release tarball alongside the two binaries.
  PKG_FILES: >-
    INSTALL
    UNINSTALL
    LICENSE
    README.md
    credagent.service
    com.credagent.enclave.plist

jobs:
  version-guard:
    name: Verify tag matches pkg/version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VER"

      # pkg/version.Version is a hand-maintained constant. Releasing a tag whose
      # binaries report a different version is how "the published binary does not
      # match the published source" happens — fail loudly instead.
      - name: Check pkg/version/version.go agrees with the tag
        run: |
          VER="${{ steps.v.outputs.version }}"
          IN_CODE=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' pkg/version/version.go)
          if [ "$IN_CODE" != "$VER" ]; then
            echo "::error::pkg/version/version.go says '$IN_CODE' but tag says '$VER'."
            echo "Bump the constant and re-tag, so shipped binaries self-report the right version."
            exit 1
          fi
          echo "OK: version constant matches tag ($VER)"

  linux:
    name: Build linux_amd64
    runs-on: ubuntu-latest
    needs: version-guard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build static binaries
        run: |
          mkdir -p stage/bin
          for c in credagent credctl; do
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -ldflags="-s -w" -o "stage/bin/$c" "./cmd/$c"
          done
          file stage/bin/credagent

      - name: Assemble package
        run: |
          VER="${{ needs.version-guard.outputs.version }}"
          DIR="credagent_${VER}_linux_amd64"
          mkdir -p "$DIR"
          cp stage/bin/credagent stage/bin/credctl "$DIR/"
          for f in $PKG_FILES; do
            [ -e "$f" ] || { echo "::error::missing package file: $f"; exit 1; }
            cp "$f" "$DIR/"
          done
          cp -R config.template "$DIR/"
          chmod 0755 "$DIR/credagent" "$DIR/credctl" "$DIR/INSTALL" "$DIR/UNINSTALL"
          tar czf "${DIR}.tar.gz" "$DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: linux_amd64
          path: '*.tar.gz'

  darwin:
    name: Build darwin_universal
    runs-on: macos-latest
    needs: version-guard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # cgo against libproc/sysctl — must be built on macOS, then lipo'd into a
      # single universal binary covering Intel and Apple Silicon.
      - name: Build universal binaries
        run: |
          mkdir -p stage/amd64 stage/arm64 stage/universal
          for c in credagent credctl; do
            CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 \
              go build -trimpath -ldflags="-s -w" -o "stage/amd64/$c" "./cmd/$c"
            CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
              go build -trimpath -ldflags="-s -w" -o "stage/arm64/$c" "./cmd/$c"
            lipo -create -output "stage/universal/$c" "stage/amd64/$c" "stage/arm64/$c"
          done
          lipo -info stage/universal/credagent

      - name: Assemble package
        run: |
          VER="${{ needs.version-guard.outputs.version }}"
          DIR="credagent_${VER}_darwin_universal"
          mkdir -p "$DIR"
          cp stage/universal/credagent stage/universal/credctl "$DIR/"
          for f in $PKG_FILES; do
            [ -e "$f" ] || { echo "::error::missing package file: $f"; exit 1; }
            cp "$f" "$DIR/"
          done
          cp -R config.template "$DIR/"
          chmod 0755 "$DIR/credagent" "$DIR/credctl" "$DIR/INSTALL" "$DIR/UNINSTALL"
          tar czf "${DIR}.tar.gz" "$DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: darwin_universal
          path: '*.tar.gz'

  publish:
    name: Checksums and publish
    runs-on: ubuntu-latest
    needs: [version-guard, linux, darwin]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true

      - name: Generate checksums
        run: |
          VER="${{ needs.version-guard.outputs.version }}"
          sha256sum ./*.tar.gz > "credagent_${VER}_checksums.txt"
          cat "credagent_${VER}_checksums.txt"

      - name: Verify package layout
        run: |
          for f in ./*.tar.gz; do
            echo "--- $f ---"
            tar tzf "$f" | head -20
          done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            *.tar.gz
            *checksums.txt
